<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Professional Networking Platform architecture</title>
  <desc id="description">Gateway and service discovery connect to authentication, posts, connections, notifications, and media components backed by Kafka, Neo4j, and PostgreSQL.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08101d"/>
      <stop offset="1" stop-color="#111a2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8fe8"/>
      <stop offset="1" stop-color="#9d92d3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <path d="M0 520L360 160L620 420L890 90L1200 390V675H0Z" fill="#2f6fd2" opacity=".055"/>
  <g fill="none" stroke="#4f8fe8" stroke-width="3" opacity=".62">
    <path d="M600 160V225"/>
    <path d="M600 225H180V285M600 225H390V285M600 225V285M600 225H810V285M600 225H1020V285"/>
    <path d="M180 385V455M390 385V455M600 385V455M810 385V455M1020 385V455"/>
    <path d="M180 455H1020" opacity=".42"/>
  </g>
  <g fill="#4f8fe8" filter="url(#glow)">
    <circle cx="600" cy="225" r="6"/>
    <circle cx="180" cy="455" r="5"/><circle cx="390" cy="455" r="5"/>
    <circle cx="600" cy="455" r="5"/><circle cx="810" cy="455" r="5"/><circle cx="1020" cy="455" r="5"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="68" fill="#92a3bd" font-size="18" letter-spacing="5">ACTIVE LEARNING / ARCHITECTURE</text>
    <text x="56" y="112" fill="#eef2f8" font-size="28" font-weight="700">PROFESSIONAL NETWORKING PLATFORM</text>

    <g>
      <rect x="435" y="126" width="330" height="76" rx="5" fill="#111c30" stroke="url(#accent)" stroke-width="2"/>
      <text x="600" y="157" text-anchor="middle" fill="#eef2f8" font-size="20" font-weight="700">GATEWAY</text>
      <text x="600" y="184" text-anchor="middle" fill="#8fa4c2" font-size="15">SERVICE DISCOVERY</text>
    </g>

    <g font-size="17" font-weight="700" text-anchor="middle">
      <g><rect x="85" y="285" width="190" height="100" rx="5" fill="#101a2b" stroke="#395981"/><text x="180" y="341" fill="#eef2f8">AUTH</text></g>
      <g><rect x="295" y="285" width="190" height="100" rx="5" fill="#101a2b" stroke="#395981"/><text x="390" y="341" fill="#eef2f8">POSTS</text></g>
      <g><rect x="505" y="285" width="190" height="100" rx="5" fill="#101a2b" stroke="#4f8fe8"/><text x="600" y="341" fill="#eef2f8">CONNECTIONS</text></g>
      <g><rect x="715" y="285" width="190" height="100" rx="5" fill="#101a2b" stroke="#395981"/><text x="810" y="341" fill="#eef2f8">NOTIFICATIONS</text></g>
      <g><rect x="925" y="285" width="190" height="100" rx="5" fill="#101a2b" stroke="#395981"/><text x="1020" y="341" fill="#eef2f8">MEDIA</text></g>
    </g>

    <g font-size="19" font-weight="700" text-anchor="middle">
      <g><rect x="225" y="490" width="230" height="86" rx="5" fill="#151d31" stroke="#9d92d3"/><text x="340" y="542" fill="#eef2f8">KAFKA</text></g>
      <g><rect x="485" y="490" width="230" height="86" rx="5" fill="#151d31" stroke="#4f8fe8"/><text x="600" y="542" fill="#eef2f8">NEO4J</text></g>
      <g><rect x="745" y="490" width="230" height="86" rx="5" fill="#151d31" stroke="#5b91bb"/><text x="860" y="542" fill="#eef2f8">POSTGRESQL</text></g>
    </g>

    <text x="600" y="628" text-anchor="middle" fill="#71839e" font-size="15" letter-spacing="3">7 SPRING BOOT COMPONENTS · JWT-PROTECTED ROUTES · EVENT-DRIVEN NOTIFICATIONS</text>
  </g>
</svg>
